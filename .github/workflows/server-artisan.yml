name: Server artisan (daftar)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare one-shot setup script
        id: prep
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/daftar-once
          sed "s/___TOKEN___/${TOKEN}/" scripts/once-setup.php > /tmp/daftar-once/__once_setup.php
          # Script lives under public/; root is one level up from public.
          sed -i 's/dirname(__DIR__)/dirname(__DIR__)/' /tmp/daftar-once/__once_setup.php
          # Fix root: when placed in public/, dirname(__DIR__) is app root. OK as-is.
          head -n 5 /tmp/daftar-once/__once_setup.php

      - name: Upload one-shot script via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.myqurana.org
          username: myqz6827
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: /tmp/daftar-once/
          server-dir: /public_html/daftar/public/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-once-setup.json
          timeout: 120000

      - name: Run setup on server
        id: hit
        run: |
          URL="https://daftar.myqurana.org/__once_setup.php?t=${{ steps.prep.outputs.token }}"
          echo "Hitting one-shot setup..."
          set +e
          code=$(curl -sS -o /tmp/once-out.txt -w "%{http_code}" --max-time 900 "$URL")
          set -e
          echo "HTTP $code"
          echo "----- body -----"
          cat /tmp/once-out.txt
          echo "----- end -----"
          grep -q 'DONE_OK' /tmp/once-out.txt

      - name: Verify portal
        run: |
          code=$(curl -sS -o /tmp/portal.html -w "%{http_code}" --max-time 60 "https://daftar.myqurana.org/")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            head -c 2000 /tmp/portal.html || true
            exit 1
          fi
          echo "Portal OK"

      - name: Cleanup leftover script if any
        if: always()
        continue-on-error: true
        run: |
          curl -sS --max-time 30 \
            "ftp://myqz6827:${{ secrets.FTP_PASSWORD }}@ftp.myqurana.org/public_html/daftar/public/" \
            -Q "DELE __once_setup.php" -o /dev/null || true
