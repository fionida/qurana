name: Deploy to Rumahweb

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Deploy app core to public_html/qurana
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.myqurana.org
          username: myqz6827
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/qurana/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/docs/**
            **/.env
            **/public/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/public/**
            **/storage/app/private/**
            **/storage/backups/**
            **/vendor.zip
            **/public/build.zip
          timeout: 600000
          log-level: standard

      # JANGAN deploy ke /public_html/ — itu document root https://myqurana.org/
      # (situs marketing). Deploy public Laravel hanya ke folder subdomain daftar.
      # Set path yang benar setelah dicek di cPanel → Domains (Document Root
      # untuk daftar.myqurana.org), contoh: /public_html/daftar/
      # - name: Deploy public assets to daftar document root
      #   uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      #   with:
      #     server: ftp.myqurana.org
      #     username: myqz6827
      #     password: ${{ secrets.FTP_PASSWORD }}
      #     port: 21
      #     protocol: ftp
      #     local-dir: ./public/
      #     server-dir: /public_html/daftar/
      #     exclude: |
      #       **/.DS_Store
      #       **/storage/**
      #     timeout: 600000
