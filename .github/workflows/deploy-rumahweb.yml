name: Deploy to Rumahweb

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # App Laravel untuk https://daftar.myqurana.org/ (document root = public_html/daftar/public)
      - name: Deploy app core to public_html/daftar
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.myqurana.org
          username: myqz6827
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/daftar/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-daftar.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/docs/**
            **/deploy/**
            **/.env
            **/public/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/public/**
            **/storage/app/private/**
            **/storage/backups/**
            **/vendor.zip
            **/public/build.zip
          timeout: 600000
          log-level: standard

      - name: Deploy public assets to public_html/daftar/public
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.myqurana.org
          username: myqz6827
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./public/
          server-dir: /public_html/daftar/public/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-daftar-public.json
          exclude: |
            **/.DS_Store
            **/storage/**
          timeout: 600000
          log-level: standard
