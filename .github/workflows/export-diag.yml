name: Export diag (daftar)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: prep
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/daftar-once
          sed "s/___TOKEN___/${TOKEN}/" scripts/once-export-diag.php > /tmp/daftar-once/__export_diag.php

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.myqurana.org
          username: myqz6827
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: /tmp/daftar-once/
          server-dir: /public_html/daftar/public/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-export-diag.json
          timeout: 120000

      - name: Hit diag (retry through WAF)
        run: |
          URL="https://daftar.myqurana.org/__export_diag.php?t=${{ steps.prep.outputs.token }}"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          for i in 1 2 3 4 5 6 7 8; do
            echo "--- attempt $i ---"
            code=$(curl -sS -A "$UA" -o /tmp/diag.txt -w "%{http_code}" --max-time 120 "$URL" || echo "000")
            echo "HTTP $code"
            head -c 4000 /tmp/diag.txt || true
            echo
            if grep -qE 'DIAG_OK|ERROR=|phpspreadsheet_dir=' /tmp/diag.txt; then
              exit 0
            fi
            sleep 5
          done
          echo "Failed to get diag response"
          exit 1

      - if: always()
        continue-on-error: true
        run: |
          curl -sS --max-time 30 --user "myqz6827:${{ secrets.FTP_PASSWORD }}" \
            "ftp://ftp.myqurana.org/public_html/daftar/public/" \
            -Q "DELE __export_diag.php" -o /dev/null || true
