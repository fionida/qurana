name: FTP list dirs (debug)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP root and public_html
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "myqz6827","$FTP_PASS" ftp://ftp.myqurana.org <<'EOF'
          set ftp:ssl-allow no
          set net:timeout 30
          cls -la
          echo "==== public_html ===="
          cls -la public_html
          echo "==== looking for daftar ===="
          cls -la public_html/daftar || true
          cls -la public_html/daftar.myqurana.org || true
          cls -la daftar.myqurana.org || true
          cls -la public_html/qurana || true
          bye
          EOF
